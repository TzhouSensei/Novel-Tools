<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="mdt.library.title">MDT Library</title>

        <link href="../../../libs/theme/theme.css" rel="stylesheet" />
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    sans-serif;
                margin: 0;
                padding: 20px;
                transition:
                    background 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    color 0.4s cubic-bezier(0.4, 0, 0.2, 1);

                min-height: 100vh;
                background-attachment: fixed;
            }

            .container {
                max-width: 1100px;
                margin: 0 auto;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
                flex-wrap: wrap;
                gap: 12px;
            }

            h1 {
                margin: 0;
                font-size: 24px;
            }

            .header-actions {
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }

            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                font-size: 14px;
                transition: 0.2s;
            }

            .btn-primary {
                background: var(--success);
                color: var(--toast-color);
            }

            .btn-primary:hover {
                background: var(--success-hover);
            }

            .btn-danger {
                background: var(--danger);
                color: var(--toast-color);
            }

            .btn-ghost {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--text-muted);
            }

            .btn-ghost:hover {
                background: var(--hover-bg);
            }

            .upload-btn-wrapper {
                position: relative;
                overflow: hidden;
                display: inline-block;
            }

            .upload-btn-wrapper input[type="file"] {
                font-size: 100px;
                position: absolute;
                left: 0;
                top: 0;
                opacity: 0;
                cursor: pointer;
                width: 100%;
                height: 100%;
            }

            .search-input {
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 14px;
                min-width: 200px;
                background: var(--card-bg);
                color: var(--text);
            }

            .sort-select {
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 14px;
                background: var(--card-bg);
                color: var(--text);
            }

            .stories-list {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .story-card {
                display: flex;
                align-items: center;
                background: var(--card-bg);
                border-radius: 12px;
                padding: 12px 16px;
                box-shadow: var(--shadow-sm);
                border: 1px solid var(--border);
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                gap: 16px;
                width: 100%;
            }

            .story-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-lg);
            }

            .story-cover {
                width: 56px;
                height: 78px;
                object-fit: cover;
                border-radius: 6px;
                background-color: var(--cover-bg);
                flex-shrink: 0;
                border: 1px solid var(--border);
            }

            .story-info {
                flex: 1;
                min-width: 0;
            }

            .btn.epub-btn {
                padding: 14px 18px;
                font-size: 15px;
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                width: 100%;
                text-align: center;
            }

            .btn.epub-btn:hover {
                border-color: var(--primary);
            }

            .story-title {
                font-size: 16px;
                font-weight: 600;
                margin: 0 0 4px 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .story-meta {
                font-size: 13px;
                margin: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .story-actions {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .btn-read {
                background: var(--primary);
                color: var(--toast-color);
                padding: 8px 18px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                font-size: 14px;
                transition: 0.2s;
            }

            .btn-edit {
                background: var(--read-bg);
                color: var(--text);
                padding: 8px 18px;
                border: 1px solid var(--border);
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                font-size: 14px;
                transition: 0.2s;
            }

            .btn-edit:hover {
                background: var(--hover-bg);
            }

            .btn-delete-story {
                background: transparent;
                color: var(--danger);
                border: none;
                cursor: pointer;
                font-size: 18px;
                padding: 6px;
                border-radius: 6px;
                flex-shrink: 0;
            }

            .btn-delete-story:hover {
                background: var(--danger-hover-bg);
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                background: var(--card-bg);
                border-radius: 12px;
                border: 1px dashed var(--border);
            }

            .empty-state .big-icon {
                font-size: 48px;
                margin-bottom: 12px;
            }

            .empty-state p {
                margin: 0 0 16px 0;
            }

            .toast {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                border-radius: 8px;
                box-shadow: var(--shadow-md);
                z-index: 9999;
                opacity: 0;
                transition: opacity 0.3s;
                pointer-events: none;
            }

            .toast.show {
                opacity: 1;
            }

            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: var(--modal-overlay-bg);
                z-index: 10000;
                justify-content: center;
                align-items: center;
            }

            .modal-overlay.show {
                display: flex;
            }

            .modal {
                background: var(--card-bg);
                border-radius: 12px;
                padding: 24px;
                width: 90%;
                max-width: 500px;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: var(--shadow-lg);
            }

            .modal h3 {
                margin: 0 0 16px 0;
            }

            .modal label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin: 12px 0 4px 0;
            }

            .modal input,
            .modal textarea {
                width: 100%;
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 14px;
                font-family: inherit;
                background: var(--bg);
                color: var(--text);
            }

            .modal textarea {
                min-height: 80px;
                resize: vertical;
            }

            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                margin-top: 20px;
            }

            @media (max-width: 600px) {
                body {
                    padding: 12px;
                }

                .story-cover {
                    width: 44px;
                    height: 62px;
                }

                .story-title {
                    font-size: 14px;
                }

                .story-meta {
                    font-size: 12px;
                }

                .btn-read,
                .btn-edit {
                    padding: 6px 12px;
                    font-size: 13px;
                }

                .search-input {
                    min-width: 100%;
                }

                header {
                    flex-direction: column;
                    align-items: flex-start;
                }

                body {
                    -webkit-tap-highlight-color: transparent;
                }
            }

            .epub-tools-modal {
                max-width: 460px;
            }

            .epub-tools-sub {
                margin: -8px 0 16px;
                font-size: 13px;
                color: var(--text-muted, #666);
            }

            .epub-tools-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .epub-tool-card {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 16px;
                border: 1px solid var(--border, #e0e0e0);
                border-radius: 12px;
                background: var(--bg, #f5f7fa);
                color: var(--text, #222);
                text-align: left;
                cursor: pointer;
                font: inherit;
                transition:
                    border-color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .epub-tool-card:hover {
                border-color: var(--primary, #4a90e2);
                background: var(--hover-bg, #e8f0fe);
                transform: translateY(-2px);
            }

            .epub-tool-card .icon {
                font-size: 26px;
            }

            .epub-tool-card .name {
                font-weight: 700;
                font-size: 14px;
            }

            .epub-tool-card .desc {
                font-size: 12px;
                color: var(--text-muted, #666);
            }

            @media (max-width: 480px) {
                .epub-tools-grid {
                    grid-template-columns: 1fr;
                }
            }
            #chuy {
                transition: opacity 1s ease;
            }
            .fade-out {
                opacity: 0;
            }
            .fade-in {
                opacity: 1;
            }
            .fade-line {
                opacity: 0;
                transform: translateX(80px);
                transition:
                    opacity 1s ease,
                    transform 1s cubic-bezier(0.22, 1, 0.36, 1);
                will-change: transform, opacity;
            }
            .fade-line.show {
                opacity: 1;
                transform: translateX(0);
            }
            .fade-line.exit {
                opacity: 0;
                transform: translateX(-120px);
            }
            .slide-item {
                opacity: 0;
                transform: translateX(120px);
                transition:
                    transform 1s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 1s ease;
                will-change: transform, opacity;
            }
            .slide-item.show {
                opacity: 1;
                transform: translateX(0);
            }
            .slide-item.exit {
                opacity: 0;
                transform: translateX(-140px);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1 data-i18n="mdt.library.title">📚 MDT Library</h1>
                <div class="header-actions">
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        data-i18n-placeholder="mdt.library.search"
                        placeholder="🔍 Tìm truyện..."
                    />
                    <select id="sort-select" class="sort-select">
                        <option
                            value="recent"
                            data-i18n="mdt.library.sort.recent"
                        >
                            Gần đây nhất
                        </option>
                        <option
                            value="title"
                            data-i18n="mdt.library.sort.title"
                        >
                            Theo tên
                        </option>
                        <option
                            value="created"
                            data-i18n="mdt.library.sort.created"
                        >
                            Mới thêm
                        </option>
                    </select>
                    <div class="upload-btn-wrapper">
                        <button
                            class="btn btn-primary"
                            data-i18n="mdt.library.import"
                        >
                            ➕ Import truyện
                        </button>
                        <input
                            type="file"
                            id="library-file-input"
                            accept=".txt"
                            multiple
                        />
                    </div>
                    <button
                        id="new-chapter-btn"
                        class="btn btn-primary"
                        data-i18n="new.novel"
                    >
                        ➕ Tạo truyện mới
                    </button>
                </div>
                <button
                    id="epub-tools-btn"
                    class="btn epub-btn"
                    data-i18n="epub_create"
                >
                    📚 Công cụ tạo EPUB
                </button>
            </header>

            <div id="stories-list" class="stories-list"></div>
            <h2 data-i18n="import.txt.notify"></h2>
            <pre id="chuy" style="margin: 0px 0; line-height: 1.25">
                <p data-i18n="note.1"></p>
                <p data-i18n="note.2"></p>
                <p data-i18n="note.3"></p>
                <p data-i18n="note.4"></p>
                <p data-i18n="note.5"></p>
            </pre>
        </div>

        <div id="create-modal" class="modal-overlay">
            <div class="modal">
                <h3 data-i18n="mdt.library.create.title">Tạo truyện mới</h3>
                <label data-i18n="mdt.library.create.title.label"
                    >Tiêu đề:</label
                >
                <input type="text" id="create-title" />
                <label data-i18n="mdt.library.create.desc.label">Mô tả:</label>
                <textarea
                    id="create-desc"
                    data-i18n-placeholder="mdt.library.create.desc.placeholder"
                    placeholder="Nhập mô tả truyện..."
                ></textarea>
                <label data-i18n="mdt.library.create.char.label">
                    Danh sách nhân vật (mỗi dòng 1 nhân vật):
                </label>
                <textarea
                    id="create-chars"
                    data-i18n-placeholder="mdt.library.create.char.placeholder"
                    placeholder="Nhập danh sách nhân vật..."
                ></textarea>
                <div class="modal-actions">
                    <button
                        id="create-cancel"
                        class="btn btn-ghost"
                        data-i18n="ui.cancel"
                    >
                        Hủy
                    </button>
                    <button
                        id="create-ok"
                        class="btn btn-primary"
                        data-i18n="mdt.library.create.submit"
                    >
                        Tạo
                    </button>
                </div>
            </div>
        </div>

        <div id="epub-tools-overlay" class="modal-overlay">
            <div class="modal epub-tools-modal">
                <h3 data-i18n="epub_create">📚 Công cụ tạo EPUB</h3>
                <p class="epub-tools-sub" data-i18n="epub_create.choose">
                    Chọn một trong hai công cụ:
                </p>
                <div class="epub-tools-grid">
                    <button
                        class="epub-tool-card"
                        data-goto="creation_tools/configuration/index.html"
                    >
                        <span class="icon">⚙️</span>
                        <span class="name" data-i18n="tool.configuration"
                            >Cấu hình</span
                        >
                        <span class="desc" data-i18n="tool.configuration.desc"
                            >Cấu hình công cụ tạo EPUB</span
                        >
                    </button>
                    <button
                        class="epub-tool-card"
                        data-goto="creation_tools/parser/index.html"
                    >
                        <span class="icon">🧩</span>
                        <span class="name" data-i18n="tool.parser">Parser</span>
                        <span class="desc" data-i18n="tool.parser.desc"
                            >Chuyển đổi file EPUB sang định dạng MDT</span
                        >
                    </button>
                </div>
                <div class="modal-actions">
                    <button
                        id="epub-tools-close"
                        class="btn btn-ghost"
                        data-i18n="ui.cancel"
                    >
                        Hủy
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <noscript>
            <div
                style="text-align: center; color: red; margin: 20px 0"
                data-i18n="noscript.tools"
            ></div>
        </noscript>

        <script src="../../../libs/i18n/i18n.js"></script>
        <script src="../../../libs/theme/theme.js"></script>
        <script src="./shared/mdt-parser.js"></script>
        <script src="./shared/mdt-db.js"></script>
        <script src="./library.js"></script>
        <script src="introscr.js"></script>
        <script>
            (function () {
                var overlay = document.getElementById("epub-tools-overlay");
                var openBtn = document.getElementById("epub-tools-btn");
                if (!overlay || !openBtn) return;

                function openOverlay() {
                    overlay.classList.add("show");
                }

                function closeOverlay() {
                    overlay.classList.remove("show");
                }

                openBtn.addEventListener("click", openOverlay);

                var closeBtn = document.getElementById("epub-tools-close");
                if (closeBtn) closeBtn.addEventListener("click", closeOverlay);

                overlay.addEventListener("click", function (e) {
                    if (e.target === overlay) closeOverlay();
                });

                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") closeOverlay();
                });

                var cards = overlay.querySelectorAll("[data-goto]");
                for (var i = 0; i < cards.length; i++) {
                    cards[i].addEventListener("click", function () {
                        window.location.href = this.getAttribute("data-goto");
                    });
                }
            })();
        </script>
        <script>
            let uiVisible = false;
            document.addEventListener("click", function (e) {
                if (window.innerWidth > 600) return;
                uiVisible = !uiVisible;
                if (uiVisible) {
                    document.body.classList.add("ui-visible");
                } else {
                    document.body.classList.remove("ui-visible");
                }
            });
        </script>
    </body>
</html>

<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="mdt.reader.title">Đọc truyện</title>

        <link href="../../../libs/theme/theme.css" rel="stylesheet" />
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    sans-serif;
                margin: 0;
                padding: 0;
                transition:
                    background 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    color 0.4s cubic-bezier(0.4, 0, 0.2, 1);

                min-height: 100vh;
                background-attachment: fixed;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
                flex-wrap: wrap;
                gap: 16px;
                padding: 16px 20px;
                background: var(--card-bg);
                border-radius: 16px;
                box-shadow: var(--shadow-card);
                border: 1px solid var(--border);
                backdrop-filter: blur(10px);
            }

            .back-btn {
                padding: 10px 18px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--bg);
                color: var(--text);
                cursor: pointer;
                font-weight: 600;
                font-size: 14px;
                text-decoration: none;
                transition: all 0.25s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .back-btn:hover {
                background: var(--hover-bg);
                transform: translateY(-1px);
                box-shadow: var(--shadow-sm);
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .story-header {
                background: var(--card-bg);
                border-radius: 20px;
                padding: 28px 32px;
                box-shadow: var(--shadow-card);
                border: 1px solid var(--border);
                margin-bottom: 24px;
                position: relative;
                overflow: hidden;
            }

            .story-header::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, var(--primary), transparent);
            }

            .story-title {
                font-size: 26px;
                font-weight: 700;
                margin: 0 0 8px 0;
                letter-spacing: -0.02em;
            }

            .story-desc {
                font-size: 15px;
                margin: 0;
                white-space: pre-wrap;
                line-height: 1.7;
                max-height: 120px;
                overflow-y: auto;
                color: var(--text-muted);
            }

            .chapter-list-title {
                font-size: 18px;
                font-weight: 600;
                margin: 0 0 16px 0;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .chapter-list {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            @media (max-width: 999px) {
                .chapter-list {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            .chapter-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.25s ease;
                background: var(--card-bg);
                border: 1px solid var(--border);
                font-weight: 500;
                min-width: 0;
            }

            .chapter-item:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-sm);
                border-color: var(--primary);
            }

            .chapter-item.read {
                font-weight: 400;
                opacity: 0.7;
            }

            .chapter-item .chapter-title {
                flex: 1;
                margin-right: 8px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .chapter-item .chapter-status {
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 8px;
                flex-shrink: 0;
                font-weight: 600;
            }

            .chapter-item.read .chapter-status {
                background: var(--read-bg);
                color: var(--read-color);
            }

            .chapter-item:not(.read) .chapter-status {
                background: var(--primary);
                color: #fff;
            }

            .toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                padding: 14px 28px;
                border-radius: 12px;
                box-shadow: var(--shadow-pop);
                z-index: 9999;
                opacity: 0;
                transition:
                    opacity 0.3s,
                    transform 0.3s;
                pointer-events: none;
                font-weight: 500;
            }

            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(-8px);
            }

            @media (max-width: 600px) {
                .container {
                    padding: 12px;
                }

                .top-bar {
                    padding: 12px 16px;
                }

                .story-header {
                    padding: 20px;
                }

                .story-title {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div id="story-header" class="story-header">
                <h1 id="story-title" class="story-title"></h1>
                <p id="story-desc" class="story-desc"></p>
            </div>

            <h2 class="chapter-list-title" data-i18n="mdt.reader.chapter_list">
                📑 Danh sách chương
            </h2>
            <div id="chapter-list" class="chapter-list"></div>
        </div>

        <div id="toast" class="toast"></div>

        <noscript>
            <div
                style="text-align: center; color: red; margin: 20px 0"
                data-i18n="noscript.tools"
            ></div>
        </noscript>

        <script src="../../../libs/i18n/i18n.js"></script>
        <script src="../../../libs/theme/theme.js"></script>
        <script src="./shared/mdt-parser.js"></script>
        <script src="./shared/mdt-db.js"></script>
        <script src="./reader.js"></script>
    </body>
</html>

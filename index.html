<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#111827" />
        <title>Novel Tools</title>
        <link rel="stylesheet" href="./libs/theme/theme.css" />
        <link rel="stylesheet" href="./libs/spa/spa.css" />
        <script src="./libs/theme/theme.js"></script>
        <script src="./libs/i18n/lang.js"></script>
    </head>
    <body>
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <div id="app">
            <aside class="sidebar">
                <div class="brand" id="brand">
                    <div class="brand-mark">✦</div>
                    <div>
                        <strong data-i18n="spa.brand.title">Novel Tools</strong
                        ><small data-i18n="spa.brand.sub"
                            >Bộ công cụ tiểu thuyết</small
                        >
                    </div>
                </div>
                <nav id="mainNav">
                    <button data-route="" class="nav-btn">
                        ⌂ <span data-i18n="spa.nav.overview">Tổng quan</span>
                    </button>
                    <button data-route="mdt" class="nav-btn">
                        📚 <span data-i18n="spa.nav.mdt">MDT Library</span>
                    </button>
                    <button data-route="ereader" class="nav-btn">
                        <span data-i18n="spa.nav.ereader">EPUB Reader</span>
                    </button>
                    <button data-route="converter" class="nav-btn">
                        <span data-i18n="spa.nav.converter"
                            >Converter EPUB ➜ TXT</span
                        >
                    </button>
                    <button data-route="infoeditor" class="nav-btn">
                        <span data-i18n="spa.nav.infoeditor"
                            >EPUB Info Editor</span
                        >
                    </button>
                    <button data-route="creator" class="nav-btn">
                        <span data-i18n="spa.nav.creator">Story Studio</span>
                    </button>
                    <div id="creationDropdown" class="nav-dropdown">
                        <button
                            id="creationToggle"
                            class="nav-btn drop-toggle"
                            aria-expanded="false"
                            aria-controls="creationDropMenu"
                        >
                            🛠
                            <span data-i18n="spa.nav.creation"
                                >EPUB Creation Tools</span
                            >
                            <span class="drop-arrow" aria-hidden="true">▸</span>
                        </button>
                        <div id="creationDropMenu" class="drop-menu">
                            <button
                                data-route="mdt/creation-tools/configuration"
                                class="nav-btn drop-item"
                            >
                                ⚙️
                                <span data-i18n="spa.nav.creation.config"
                                    >EPUB Configuration</span
                                >
                            </button>
                            <button
                                data-route="mdt/creation-tools/parser"
                                class="nav-btn drop-item"
                            >
                                🧩
                                <span data-i18n="spa.nav.creation.parser"
                                    >EPUB Parser</span
                                >
                            </button>
                        </div>
                    </div>
                </nav>
                <div class="sidebar-section">
                    <div class="section-label" data-i18n="spa.nav.section">
                        Công cụ
                    </div>
                </div>
                <div class="sidebar-pin-row">
                    <button
                        id="pinSidebar"
                        class="icon-btn"
                        data-i18n-title="spa.pin.title"
                        title="Ghim sidebar"
                    ></button>
                </div>
            </aside>

            <main class="main">
                <header class="topbar">
                    <div class="topbar-left">
                        <button id="mobileMenu" class="icon-btn" title="☰">
                            ☰
                        </button>
                        <button
                            id="backBtn"
                            class="icon-btn"
                            data-i18n-title="spa.back.title"
                            title="Quay lại"
                        >
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M15 18l-6-6 6-6" />
                            </svg>
                        </button>
                        <div id="breadcrumb">Tổng quan</div>
                    </div>
                    <div class="top-actions">
                        <select
                            id="themeSelect"
                            class="theme-select"
                            data-i18n-title="appearance.opt"
                        >
                            <option value="" data-i18n="appearance.opt.default">
                                Default
                            </option>
                            <option
                                value="ruby"
                                data-i18n="appearance.opt.ruby"
                            >
                                Ruby
                            </option>
                            <option
                                value="navajo"
                                data-i18n="appearance.opt.navajo"
                            >
                                Navajo
                            </option>
                            <option value="khaki" data-i18n="appearance.khaki">
                                Khaki
                            </option>
                            <option
                                value="dark"
                                data-i18n="appearance.opt.dark"
                            >
                                🌙 Dark
                            </option>
                            <option
                                value="deep"
                                data-i18n="appearance.opt.deep"
                            >
                                🕳 Deep
                            </option>
                            <option
                                value="anias"
                                data-i18n="appearance.opt.anias"
                            >
                                🍂 Anias
                            </option>
                            <option
                                value="dark_neon"
                                data-i18n="appearance.opt.dark_neon"
                            >
                                🌌 Neon
                            </option>
                            <option
                                value="mint"
                                data-i18n="appearance.opt.mint"
                            >
                                🌿 Mint
                            </option>
                            <option
                                value="sakura"
                                data-i18n="appearance.opt.sakura"
                            >
                                🌸 Sakura
                            </option>
                            <option
                                value="lavender"
                                data-i18n="appearance.opt.lavender"
                            >
                                💜 Lavender
                            </option>
                            <option
                                value="mocha"
                                data-i18n="appearance.opt.mocha"
                            >
                                ☕ Mocha
                            </option>
                            <option
                                value="ocean"
                                data-i18n="appearance.opt.ocean"
                            >
                                🌊 Ocean
                            </option>
                            <option
                                value="ember"
                                data-i18n="appearance.opt.ember"
                            >
                                🔥 Ember
                            </option>
                            <option
                                value="universe"
                                data-i18n="appearance.opt.universe"
                            >
                                🪐 Universe
                            </option>
                            <option
                                value="frost_land"
                                data-i18n="appearance.opt.frost_land"
                            >
                                ❄️ Frost Land
                            </option>
                        </select>
                        <div class="lang-wrapper"></div>
                    </div>
                </header>
                <section id="content" class="content">
                    <div id="homeView" class="home-view"></div>
                    <iframe id="toolFrame" title="Novel Tool" hidden></iframe>
                </section>
            </main>
        </div>

        <div id="toast" class="toast"></div>

        <noscript>
            <div
                style="text-align: center; color: red; margin: 20px 0"
                data-i18n="noscript.tools"
            ></div>
        </noscript>

        <script src="./libs/i18n/i18n.js"></script>
        <script src="./libs/spa/spa.js"></script>
    </body>
</html>
